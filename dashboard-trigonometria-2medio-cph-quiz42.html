const lessons=[{name:'Inicio',title:'🚀 Activación de conocimientos',html:`<p>Hoy aprenderás a reconocer los lados de un triángulo rectángulo y a utilizar las razones trigonométricas para calcular medidas.</p><div class="grid"><div class="tile"><b>1. Observo</b><p>Identifico el ángulo de 90° y la hipotenusa.</p></div><div class="tile purple"><b>2. Comprendo</b><p>Relaciono seno, coseno y tangente con los lados.</p></div><div class="tile yellow"><b>3. Aplico</b><p>Resuelvo un ejercicio, paso a paso.</p></div></div><h3>Observa el triángulo</h3>${triangle()}<p><b>Recuerda:</b> la hipotenusa está frente al ángulo recto y es el lado más largo.</p>`,q:[['¿Cuál es el lado más largo de un triángulo rectángulo?',['Hipotenusa','Cateto opuesto','Cateto adyacente'],0,'La hipotenusa siempre está frente al ángulo recto.']]},{name:'Pitágoras',title:'🟦 Teorema de Pitágoras',html:`<p>Sirve para encontrar un lado desconocido de un triángulo rectángulo.</p><div class="formula">a² + b² = h²</div><p><b>a</b> y <b>b</b> son catetos. <b>h</b> es la hipotenusa.</p><div class="step">Paso 1: catetos 3 y 4 → 3² + 4² = h².</div><div class="step">Paso 2: 9 + 16 = 25 → h² = 25.</div><div class="step">Paso 3: h = √25 = <b>5</b>.</div><div class="tile yellow"><b>Atención:</b> si buscas un cateto, debes restar: a² = h² − b².</div>`,q:[['Si los catetos miden 6 y 8, ¿cuánto mide la hipotenusa?',['10','14','100'],0,'6² + 8² = 36 + 64 = 100; √100 = 10.'],['Si la hipotenusa es 13 y un cateto es 5, ¿cuánto mide el otro?',['18','12','8'],1,'13² − 5² = 169 − 25 = 144; √144 = 12.']]},{name:'Razones',title:'🎯 Seno, coseno y tangente',html:`<p>Los nombres <b>opuesto</b> y <b>adyacente</b> dependen del ángulo que estás observando.</p>${triangle()}<div class="grid"><div class="tile"><h3>Seno</h3><div class="formula">sen θ = opuesto / hipotenusa</div></div><div class="tile purple"><h3>Coseno</h3><div class="formula">cos θ = adyacente / hipotenusa</div></div><div class="tile pink"><h3>Tangente</h3><div class="formula">tan θ = opuesto / adyacente</div></div></div><p><b>Truco:</b> SOH–CAH–TOA. Seno Opuesto Hipotenusa; Coseno Adyacente Hipotenusa; Tangente Opuesto Adyacente.</p>`,q:[['¿Qué razón usa opuesto e hipotenusa?',['Coseno','Seno','Tangente'],1,'Seno = opuesto / hipotenusa.'],['¿Qué razón usa opuesto y adyacente?',['Tangente','Seno','Coseno'],0,'Tangente = opuesto / adyacente.']]},{name:'Inversas',title:'🔄 Razones trigonométricas inversas',html:`<p>Las razones recíprocas permiten invertir la fracción de cada razón trigonométrica.</p><div class="grid"><div class="tile"><b>Cosecante</b><div class="formula">csc θ = h / op = 1/sen θ</div></div><div class="tile purple"><b>Secante</b><div class="formula">sec θ = h / ad = 1/cos θ</div></div><div class="tile yellow"><b>Cotangente</b><div class="formula">cot θ = ad / op = 1/tan θ</div></div></div><div class="step">Ejemplo: si sen θ = 3/5, entonces csc θ = 5/3.</div><p class="muted">No confundas estas razones recíprocas con sen⁻¹, cos⁻¹ o tan⁻¹ de la calculadora, que sirven para encontrar ángulos.</p>`,q:[['Si cos θ = 4/5, ¿cuánto vale sec θ?',['5/4','4/5','1/4'],0,'La secante es el recíproco del coseno: 5/4.']]},{name:'Ángulos',title:'🌈 Ángulos notables',html:`<p>La tabla funciona como una sola raíz grande: para seno lee 0, 1, 2, 3, 4; para coseno lee 4, 3, 2, 1, 0. Todos se dividen por 2.</p><div class="notable-original"><div class="angle-head"><span></span><span>0°</span><span>30°</span><span>45°</span><span>60°</span><span>90°</span></div><div class="radical-area"><div class="radical-labels"><b>Sen</b><b>Cos</b></div><div class="radical-sign">√</div><div class="radical-values"><div class="numbers"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span></div><div class="numbers"><span>4</span><span>3</span><span>2</span><span>1</span><span>0</span></div></div></div><div class="common-den"><span>2</span></div></div><div class="step">Ejemplo: sen 60° = <span class="frac"><span class="num">√3</span><span class="den">2</span></span> y cos 60° = <span class="frac"><span class="num">1</span><span class="den">2</span></span>. Para tangente, divide seno por coseno.</div>`,q:[['¿Cuánto vale sen 60°?',['1/2','√3/2','1'],1,'El seno de 60° es √3/2.'],['¿Cuánto vale tan 45°?',['√3','1','0'],1,'En un triángulo de 45°–45°–90° los catetos son iguales: opuesto/adyacente = 1.']]},{name:'Aplicación',title:'🧩 Calcular lados desconocidos',html:`<p><b>Problema:</b> un triángulo rectángulo tiene hipotenusa 2√3 y un ángulo de 60°. ¿Cuánto mide el cateto opuesto?</p><div class="step">1. Identifico los datos: θ = 60°, h = 2√3, opuesto = x.</div><div class="step">2. Elijo la razón: sen 60° = x/(2√3).</div><div class="step">3. Sustituyo: √3/2 = x/(2√3).</div><div class="step">4. Multiplico: x = (√3/2)(2√3) = <b>3</b>.</div><div class="tile yellow">5. Compruebo con Pitágoras: el otro cateto es √3 porque 3² + (√3)² = 12 = (2√3)².</div><h3>Práctica guiada</h3><p>Si h = 10 y θ = 30°, ¿cuánto mide el cateto opuesto?</p><input id="numeric" type="number" placeholder="Tu respuesta" aria-label="Respuesta numérica"> <button class="btn primary" onclick="checkNumeric()">Comprobar</button><div id="numericFeedback" aria-live="polite"></div>`,q:[['Si h = 8 y θ = 60°, ¿cuál es el cateto adyacente?',['4','4√3','8√3'],0,'cos 60° = 1/2 = adyacente/8; adyacente = 4.'],['Si opuesto = 6 y adyacente = 3, ¿cuánto vale tan θ?',['1/2','2','3'],1,'tan θ = 6/3 = 2.']]},{name:'Elevación y depresión',title:'🔭 Ángulos de elevación y depresión',html:`<p><b>Elevación:</b> miramos hacia arriba desde una línea horizontal. <b>Depresión:</b> miramos hacia abajo desde una línea horizontal.</p><svg viewBox="0 0 520 220" aria-label="Ángulos de elevación y depresión"><line x1="35" y1="108" x2="480" y2="108" stroke="#64748b" stroke-width="3" stroke-dasharray="7 6"/><circle cx="250" cy="108" r="7" fill="#5147dc"/><line x1="250" y1="108" x2="455" y2="25" stroke="#0d9488" stroke-width="5"/><line x1="250" y1="108" x2="455" y2="190" stroke="#e87942" stroke-width="5"/><path d="M302 108 A52 52 0 0 0 298 88" fill="none" stroke="#0d9488" stroke-width="3"/><path d="M302 108 A52 52 0 0 1 298 128" fill="none" stroke="#e87942" stroke-width="3"/><text x="340" y="67" font-size="18" fill="#0f766e">Elevación ↗</text><text x="335" y="168" font-size="18" fill="#b45309">Depresión ↘</text><text x="45" y="96" font-size="17">Horizontal</text></svg><div class="step"><b>Ejemplo:</b> desde 20 m de distancia horizontal se observa la cima de un edificio con 45° de elevación. Como tan 45° = 1, altura = 20 × 1 = <b>20 m</b>.</div><div class="step"><b>Depresión:</b> desde una ventana se observa un objeto más abajo. El ángulo se mide desde la horizontal hacia abajo; se puede usar tangente para calcular altura o distancia.</div>`,q:[['Mirar la cima de un edificio desde el suelo forma un ángulo de…',['Elevación','Depresión','90° siempre'],0,'La mirada asciende desde la horizontal.'],['Si tan 45° = 1 y la distancia horizontal es 12 m, ¿qué altura se observa?',['6 m','12 m','24 m'],1,'La altura es 12 × 1 = 12 m.']]},
{name:'Quiz final',title:'🏁 Quiz final y metacognición',html:`<p>Responde sin apuro. Puedes volver a las estaciones anteriores en cualquier momento.</p><div class="grid"><div class="tile purple"><b>Pienso</b><p>¿Cómo identifico el lado opuesto según el ángulo?</p></div><div class="tile yellow"><b>Explico</b><p>¿Cuándo uso Pitágoras y cuándo una razón trigonométrica?</p></div><div class="tile pink"><b>Me evalúo</b><p>¿Qué parte necesito volver a practicar?</p></div></div><label for="reflection"><b>Escribe tu reflexión:</b></label><textarea id="reflection" rows="4" style="width:100%;padding:12px;border-radius:12px" placeholder="Hoy aprendí... / Necesito reforzar..."></textarea><p><button class="btn" onclick="window.print()">🖨️ Imprimir o guardar como PDF</button> <button class="btn" onclick="resetAll()">Reiniciar actividades</button></p>`,q:[['Un triángulo tiene catetos 5 y 12. Su hipotenusa es…',['17','13','√17'],1,'5² + 12² = 25 + 144 = 169; √169 = 13.'],['Si sen θ = 1/2, entonces csc θ es…',['2','1/2','1'],0,'La cosecante invierte el seno: 2.'],['Si θ = 30° y h = 12, el cateto opuesto mide…',['6√3','12','6'],2,'sen 30° = 1/2; opuesto = 12/2 = 6.']]}];

", "options": ["3/5", "5/4", "4/5"], "correct": 2, "explanation": "Coseno = 4/5."}, {"topic": "Razones", "question": "Opuesto 6 y adyacente 2: ¿tangente?", "options": ["1/3", "3", "4"], "correct": 1, "explanation": "Tangente = 6/2 = 3."}, {"topic": "Razones", "question": "¿Qué cambia al escoger otro ángulo agudo?", "options": ["La hipotenusa", "Opuesto y adyacente", "El ángulo recto"], "correct": 1, "explanation": "Los catetos intercambian sus nombres relativos."}, {"topic": "Recíprocas", "question": "¿Qué razón es recíproca del seno?", "options": ["Secante", "Cosecante", "Cotangente"], "correct": 1, "explanation": "csc = 1/sen."}, {"topic": "Recíprocas", "question": "¿Qué razón es recíproca del coseno?", "options": ["Secante", "Cosecante", "Tangente"], "correct": 0, "explanation": "sec = 1/cos."}, {"topic": "Recíprocas", "question": "¿Qué razón es recíproca de la tangente?", "options": ["Seno", "Cosecante", "Cotangente"], "correct": 2, "explanation": "cot = 1/tan."}, {"topic": "Recíprocas", "question": "Si seno = 2/5, ¿cosecante?", "options": ["5/2", "2/5", "3/5"], "correct": 0, "explanation": "Invertimos la fracción."}, {"topic": "Recíprocas", "question": "Si coseno = 3/4, ¿secante?", "options": ["3/4", "4/3", "1/4"], "correct": 1, "explanation": "Invertimos la fracción."}, {"topic": "Recíprocas", "question": "Si tangente = 2, ¿cotangente?", "options": ["2", "1/2", "4"], "correct": 1, "explanation": "Recíproco de 2 es 1/2."}, {"topic": "Recíprocas", "question": "¿sen⁻¹ de calculadora y cosecante significan lo mismo?", "options": ["Sí", "No", "Solo a 45°"], "correct": 1, "explanation": "sen⁻¹ busca un ángulo; cosecante es recíproca."}, {"topic": "Notables", "question": "¿sen 0°?", "options": ["0", "1", "1/2"], "correct": 0, "explanation": "√0 / 2 = 0."}, {"topic": "Notables", "question": "¿sen 30°?", "options": ["√3/2", "1/2", "1"], "correct": 1, "explanation": "√1 / 2 = 1/2."}, {"topic": "Notables", "question": "¿sen 45°?", "options": ["√2/2", "1/2", "√3/2"], "cor ion": "La visual apunta hacia abajo."}, {"topic": "Elevación y depresión", "question": "¿Desde dónde se mide el ángulo de elevación?", "options": ["Desde la vertical", "Desde la horizontal", "Desde el suelo inclinado"], "correct": 1, "explanation": "Se mide desde una horizontal."}, {"topic": "Elevación y depresión", "question": "A 10 m de un edificio, elevación 45°: ¿altura?", "options": ["5 m", "20 m", "10 m"], "correct": 2, "explanation": "tan 45° = 1; altura = 10 m."}, {"topic": "Elevación y depresión", "question": "A 20 m de una torre, elevación 45°: ¿altura?", "options": ["20 m", "10 m", "40 m"], "correct": 0, "explanation": "tan 45° = 1; altura = 20 m."}, {"topic": "Elevación y depresión", "question": "Altura 6 m y distancia 6 m: ¿tan del ángulo?", "options": ["2", "1", "1/2"], "correct": 1, "explanation": "tan = 6/6 = 1."}, {"topic": "Elevación y depresión", "question": "Ángulo de depresión: ¿hacia dónde apunta la mirada?", "options": ["Abajo de la horizontal", "Arriba de la horizontal", "Solo al frente"], "correct": 0, "explanation": "Se mide hacia abajo desde la horizontal."}];
let quizQuestions=[],quizIndex=0,quizResponses={},quizFinished=false;
function newQuiz(){quizQuestions=[...questionBank].sort(()=>Math.random()-.5).slice(0,7);quizIndex=0;quizResponses={};quizFinished=false;}
function renderQuiz(){
document.querySelector('#nav').innerHTML=lessons.map((l,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${i+1}. ${l.name}${completed.has(i)?' ✓':''}</button>`).join('');
if(!quizQuestions.length)newQuiz();
let q=quizQuestions[quizIndex],a=quizResponses[quizIndex];
document.querySelector('#content').innerHTML=`<section class="panel lesson"><h2>🏁 Quiz final: 7 preguntas aleatorias</h2><p>Banco de <b>42 preguntas</b> sobre Pitágoras, razones, recíprocas, ángulos notables, aplicaciones, elevación y depresión.</p><div class="tile purple"><b>Pregunta ${quizIndex+1} de 7</b><p>Contenido: ${q.topic}</p></div><div class="step">Lee la pregunta, selecciona una alternativa y revisa la explicación. Al finalizar recibirás tu resultado.</div><div class="tile yellow"><b>Tu avance:</b> ${Object.keys(quizResponses).length} de 7 respondidas.</div><button class="btn" onclick="newQuiz();renderQuiz()">↻ Nuevo quiz aleatorio</button></section><section class="panel practice"><h2>✏️ ${quizFinished?'Resultado final':'Responde'}</h2>${quizFinished?`<div class="formula">Puntaje: ${quizQuestions.filter((x,i)=>quizResponses[i]===x.correct).length} / 7</div><p>Revisa las respuestas y vuelve a intentarlo cuando quieras.</p><button class="btn primary" onclick="newQuiz();renderQuiz()">Reintentar con otras 7 preguntas</button>`:`<div class="questionCard"><h3 class="quiz-title">${q.question}</h3>${q.options.map((o,i)=>`<button class="answer" onclick="chooseQuiz(${i})">${'ABC'[i]}. ${o}</button>`).join('')}<div id="quizFeedback" class="feedback ${a===undefined?'':a===q.correct?'good':'bad'}">${a===undefined?'':(a===q.correct?'✓ Correcto. ':'↻ Respuesta correcta: '+q.options[q.correct]+'. ')+q.explanation}</div></div><div class="questionActions"><button class="btn" onclick="quizIndex=Math.max(0,quizIndex-1);renderQuiz()" ${quizIndex===0?'disabled':''}>← Anterior</button><button class="btn primary" onclick="advanceQuiz()">${quizIndex===6?'Ver resultado':'Siguiente pregunta →'}</button></div>`}</section>`;
document.querySelector('#progressText').textContent=completed.size+' de 8';document.querySelector('#bar').style.width=completed.size/8*100+'%';verticalFractions(document.querySelector('#content'));fitContent();
}
function chooseQuiz(k){quizResponses[quizIndex]=k;beep(k===quizQuestions[quizIndex].correct);renderQuiz();}
function advanceQuiz(){if(quizResponses[quizIndex]===undefined){alert('Selecciona una respuesta antes de continuar.');return;}if(quizIndex===6){quizFinished=true;completed.add(7)}else quizIndex++;renderQuiz();}

function triangle(){return `<svg viewBox="0 0 400 240" role="img" aria-label="Triángulo rectángulo: cateto vertical opuesto, horizontal adyacente e hipotenusa diagonal, ángulo theta a la derecha"><path d="M65 190 L65 35 L330 190 Z" fill="#e4f1ff" stroke="#4154b3" stroke-width="4"/><path d="M65 170 H85 V190" fill="none" stroke="#4154b3" stroke-width="3"/><path d="M296 190 A34 34 0 0 0 301 173" fill="none" stroke="#e88a20" stroke-width="3"/><text x="300" y="170" font-size="20">θ</text><text x="6" y="110" font-size="16">Opuesto</text><text x="150" y="215" font-size="16">Adyacente</text><text x="185" y="93" font-size="16" transform="rotate(30 185 93)">Hipotenusa</text></svg>`}
let current=0;const completed=new Set();const answered={};function beep(ok){if(!document.querySelector('#sound').checked)return;try{let ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=ok?660:240;o.connect(g);g.connect(ctx.destination);g.gain.value=.06;o.start();o.stop(ctx.currentTime+.13)}catch(e){}}
let questionIndex=0;

function verticalFractions(root){
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];
 while(walker.nextNode())nodes.push(walker.currentNode);
 const re=/(√\(?[0-9]+\)?|√[0-9]+|[0-9]+|[a-zA-ZáéíóúÁÉÍÓÚθ]+)\s*\/\s*(√\(?[0-9]+\)?|√[0-9]+|[0-9]+|[a-zA-ZáéíóúÁÉÍÓÚθ]+(?:\s*θ)?)/g;
 for(const node of nodes){if(!node.parentElement||node.parentElement.closest('script,style,textarea'))continue;const txt=node.nodeValue;re.lastIndex=0;if(!re.test(txt))continue;re.lastIndex=0;const frag=document.createDocumentFragment();let last=0,m;while((m=re.exec(txt))){frag.append(document.createTextNode(txt.slice(last,m.index)));const f=document.createElement('span');f.className='frac';const n=document.createElement('span');n.className='num';n.textContent=m[1];const d=document.createElement('span');d.className='den';d.textContent=m[2];f.append(n,d);frag.append(f);last=re.lastIndex;}frag.append(document.createTextNode(txt.slice(last)));node.replaceWith(frag);}
}
function render(){if(current===7){renderQuiz();return;}document.querySelector('#nav').innerHTML=lessons.map((l,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})">${i+1}. ${l.name}${completed.has(i)?' ✓':''}</button>`).join('');let l=lessons[current],j=questionIndex,q=l.q[j];document.querySelector('#content').innerHTML=`<section class="panel lesson"><h2>${l.title}</h2>${l.html}</section><section class="panel practice"><h2>✏️ Compruebo lo aprendido</h2><p class="muted">Pregunta ${j+1} de ${l.q.length} · Elige una alternativa.</p><div class="questionCard"><h3>${q[0]}</h3>${q[1].map((a,k)=>`<button class="answer" onclick="answer(${j},${k})">${'ABC'[k]}. ${a}</button>`).join('')}<div id="feedback${j}" class="feedback" aria-live="polite"></div></div><div class="questionActions"><button class="btn" onclick="previousQuestion()" ${j===0?'disabled':''}>← Anterior</button><button class="btn primary" onclick="next()">${j<l.q.length-1?'Siguiente pregunta →':current===7?'Volver al inicio':'Siguiente estación →'}</button></div></section>`;let a=answered[current+'-'+j];if(a!==undefined)showFeedback(j,a,false);document.querySelector('#progressText').textContent=completed.size+' de 8';document.querySelector('#bar').style.width=(completed.size/8*100)+'%';verticalFractions(document.querySelector('#content'));fitContent()}
function fitContent(){let panels=document.querySelectorAll('#content>.panel');panels.forEach(el=>{el.style.zoom='1';let available=el.clientHeight-12,needed=el.scrollHeight;if(needed>available){el.style.zoom=String(Math.max(.56,available/needed*.97))}})}
function go(i){current=i;questionIndex=0;render()}
function next(){if(questionIndex<lessons[current].q.length-1){questionIndex++;render()}else go((current+1)%8)}
function previousQuestion(){if(questionIndex>0){questionIndex--;render()}}
function showFeedback(j,k,sound){let q=lessons[current].q[j],ok=k===q[2],f=document.querySelector('#feedback'+j);if(!f)return;f.className='feedback '+(ok?'good':'bad');f.textContent=(ok?'✓ ¡Correcto! ':'↻ Revisa tu respuesta. ')+q[3];if(sound)beep(ok)}
function answer(j,k){answered[current+'-'+j]=k;showFeedback(j,k,true);if(lessons[current].q.every((q,i)=>answered[current+'-'+i]===q[2]))completed.add(current);document.querySelector('#progressText').textContent=completed.size+' de 8';document.querySelector('#bar').style.width=(completed.size/8*100)+'%';verticalFractions(document.querySelector('#content'));fitContent()}
window.addEventListener('resize',fitContent);
function checkNumeric(){let v=Number(document.querySelector('#numeric').value),ok=v===5;let el=document.querySelector('#numericFeedback');el.className='feedback '+(ok?'good':'bad');el.textContent=ok?'✓ Correcto: sen 30° = 1/2; x = 10 × 1/2 = 5.':'Pista: sen 30° = opuesto / hipotenusa = 1/2. Multiplica 10 por 1/2.';beep(ok)}function resetAll(){completed.clear();Object.keys(answered).forEach(k=>delete answered[k]);go(0)}render();</script></body></html>
